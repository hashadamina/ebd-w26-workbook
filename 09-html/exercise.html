<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The title displayed in the browser tab. -->
    <title>My Campus Store</title>

    <!-- Link the stylesheet in the same folder. -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Header containing the main page heading. -->
    <header>
      <h1>My Campus Store</h1>
    </header>

    <!-- Main content of the store page. -->
    <main>
      <!-- Section heading for the available items. -->
      <h2>Items</h2>

      <!-- Three products displayed in an unordered list. -->
      <ul>
        <li>Notebook</li>
        <li>Pen</li>
        <li>Backpack</li>
      </ul>

      <!-- A paragraph with a highlighted price. -->
      <p>A pen costs <span class="price">15 EGP</span>.</p>

      <!-- Link to the GIU website. -->
      <a href="https://www.giu-uni.de">GIU</a>

      <!-- Product image with alternative descriptive text. -->
      <img src="notebook.jpg" alt="A notebook for students" />

      <!-- This paragraph will be updated by the JavaScript file. -->
      <p id="script-check">The script has not run.</p>
    </main>

    <!-- Footer containing additional information. -->
    <footer>
      <p>My Campus Store - All rights reserved.</p>
    </footer>

    <!-- Load the JavaScript file at the end of the body. -->
    <script src="app.js"></script>
  </body>
</html>
